<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Budget Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
@layer base {
  body {
    background-color: #13192B;
    color: #FFFFFF;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  body.theme-light {
    background-color: #f8fafc;
    color: #0f172a;
  }
}

/* Light Mode Overrides */
.theme-light .bg-\[\#13192B\] {
  background-color: #f8fafc !important;
  color: #0f172a !important;
}

.theme-light .bg-\[\#1D2640\] {
  background-color: #ffffff !important;
  color: #0f172a !important;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05) !important;
}

.theme-light .bg-\[\#161E33\] {
  background-color: #f1f5f9 !important;
  color: #1e293b !important;
}

.theme-light .bg-\[\#1A233A\] {
  background-color: #e2e8f0 !important;
}

.theme-light .border-\[\#2B395B\],
.theme-light .border-\[\#253352\] {
  border-color: #e2e8f0 !important;
}

.theme-light .text-[#A0AEC0] {
  color: #64748b !important;
}

.theme-light .text-white {
  color: #0f172a !important;
}

.theme-light input,
.theme-light select {
  background-color: #ffffff !important;
  border-color: #cbd5e1 !important;
  color: #0f172a !important;
}

.theme-light input::placeholder {
  color: #94a3b8 !important;
}

.bento-card {
  background-color: #1D2640;
  border: 1px solid #2B395B;
  border-radius: 1.5rem; /* rounded-3xl */
  transition: all 0.2s ease-in-out;
}

.bento-card-sub {
  background-color: #161E33;
  border: 1px solid #253352;
  border-radius: 1.25rem; /* rounded-2xl */
}

.bento-card:hover {
  border-color: #3B4D7A;
}

.bg-olive {
  background-color: #9D9E54;
}

.bg-olive-dark {
  background-color: #848543;
}

.bg-olive-soft {
  background-color: rgba(157, 158, 84, 0.15);
}

.text-olive {
  color: #9D9E54;
}

.text-olive-light {
  color: #B8B96D;
}

.border-olive {
  border-color: #9D9E54;
}

.border-olive-soft {
  border-color: rgba(157, 158, 84, 0.3);
}

.bg-navy {
  background-color: #1D2640;
}

.bg-navy-dark {
  background-color: #13192B;
}

.bg-navy-sub {
  background-color: #161E33;
}

.border-navy {
  border-color: #2B395B;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

.animate-fadeIn {
  animation: fadeIn 0.25s ease-out forwards;
}

    </style>
  </head>
