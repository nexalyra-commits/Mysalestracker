workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 20.11.0
      java: 17
      android_signing:
        - my_sales_tracker_keystore
      vars:
        PACKAGE_NAME: "com.bloom.mysalestracker"
        CAPACITOR_ANDROID_PACKAGE_NAME: "com.bloom.mysalestracker"
    cache:
      cache_paths:
        - ~/.npm
        - node_modules
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web assets
        script: npm run build
      - name: Capacitor sync
        script: npx cap sync android
      - name: Build Android APK / AAB
        script: |
          cd android
          ./gradlew bundleRelease
      - name: Sign Android build
        script: |
          cd android/app/build/outputs/bundle/release
          jarsigner \
            -keystore $CM_KEYSTORE_PATH \
            -storepass $CM_KEYSTORE_PASSWORD \
            -keypass $CM_KEY_PASSWORD \
            -signedjar signed.aab \
            app-release.aab \
            $CM_KEY_ALIAS
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
      email:
        recipients:
          - bloom@example.com
        notify:
          success: true
          failure: true

  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: Bloom_ASC_Key
    environment:
      node: 20.11.0
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bloom.mysalestracker
    cache:
      cache_paths:
        - ~/.npm
        - node_modules
        - ~/Library/Caches/CocoaPods
    triggering:
      events:
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web assets
        script: npm run build
      - name: Capacitor sync
        script: npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install
      - name: Build iOS IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
        # Note: "Bloom_ASC_Key" must match an App Store Connect API key
        # added under Teams > Integrations > App Store Connect in Codemagic.
      email:
        recipients:
          - bloom@example.com
        notify:
          success: true
          failure: true
